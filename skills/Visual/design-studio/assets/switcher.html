<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Design directions</title>
<!--
  design-studio switcher. Shows one direction at a time, full size.
  Fill DIRECTIONS below: one entry per mock file in this folder.
  Keys: 1-9 pick a direction, left/right arrows step, i toggles the card note, w toggles a 390px frame.
  The ?v=<id> URL parameter opens a direction directly.
  Opened from file://, some browsers block key listening inside the mock; click the bar first, or serve the folder locally.
  The frame is deliberately neutral so it does not colour how the directions are judged.
-->
<style>
  :root {
    color-scheme: dark;
    --bar-bg: oklch(0.2 0 none / 0.92);
    --bar-ink: oklch(0.97 0 none);
    --bar-muted: oklch(0.75 0 none);
    --bar-active: oklch(0.97 0 none);
    --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
    --gap: 0.5rem;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; block-size: 100%; background: oklch(0.15 0 none); }
  body { font: 1rem/1.4 system-ui, sans-serif; overflow: clip; }
  iframe { display: block; inline-size: 100%; block-size: 100dvh; border: 0; margin-inline: auto; background: oklch(1 0 none); }
  body.narrow iframe { inline-size: 390px; max-inline-size: 100%; }
  .bar {
    position: fixed; inset-block-end: 1rem; inset-inline: 0; margin-inline: auto; inline-size: fit-content;
    display: flex; gap: var(--gap); align-items: center;
    padding: 0.375rem; border-radius: 0.75rem;
    background: var(--bar-bg); color: var(--bar-ink);
    max-inline-size: calc(100vw - 2rem); overflow-x: auto;
  }
  .bar button {
    font: inherit; color: var(--bar-muted); background: transparent;
    border: 1px solid transparent; border-radius: 0.5rem;
    padding-block: 0.5rem; padding-inline: 0.75rem; min-block-size: 44px;
    cursor: pointer; white-space: nowrap;
  }
  .bar button[aria-current="true"] { color: oklch(0.15 0 none); background: var(--bar-active); }
  .bar button:active { background-color: color-mix(in oklch, var(--bar-ink) 15%, transparent); }
  .bar button[aria-current="true"]:active { background-color: color-mix(in oklch, var(--bar-active) 85%, black); }
  .bar .role { display: block; font-size: 0.75rem; }
  .bar .sep { inline-size: 1px; align-self: stretch; background: oklch(0.45 0 none); }
  .bar button:focus-visible { outline: max(2px, 0.08em) solid var(--bar-ink); outline-offset: 0.15em; }
  .bar kbd { font: inherit; margin-inline-end: 0.375rem; }
  @media (hover: hover) and (pointer: fine) {
    .bar button:not([aria-current="true"]):hover { color: var(--bar-ink); border-color: oklch(0.5 0 none); }
  }
  @media (prefers-reduced-motion: no-preference) {
    .bar button { transition: color 150ms var(--ease-out), background-color 150ms var(--ease-out); }
    .bar button:active { scale: 0.97; }
  }
  .note {
    position: fixed; inset-block-start: 1rem; inset-inline-end: 1rem;
    inline-size: min(26rem, calc(100vw - 2rem)); max-block-size: calc(100dvh - 6rem); overflow-y: auto;
    padding: 1rem; border-radius: 0.75rem; background: var(--bar-bg); color: var(--bar-ink);
  }
  .note[hidden] { display: none; }
  .note h2 { font-size: 1rem; margin-block: 0 0.25rem; }
  .note p { margin-block: 0 0.75rem; color: var(--bar-muted); }
</style>
</head>
<body>
<iframe id="stage" title="Design direction"></iframe>
<aside class="note" id="note" hidden aria-live="polite"></aside>
<nav class="bar" id="bar" aria-label="Design directions"></nav>
<script>
  // One entry per direction. id: short slug; name: the card's name; role: Refine, Benchmark, Bridge, Fresh or Wildcard;
  // file: the mock in this folder; thesis: the card's thesis sentence.
  const DIRECTIONS = [
    { id: 'refine', name: 'Direction name', role: 'Refine', file: 'refine.html', thesis: 'Thesis sentence.' },
  ];

  const stage = document.getElementById('stage');
  const bar = document.getElementById('bar');
  const note = document.getElementById('note');
  let current = 0;

  DIRECTIONS.forEach((d, i) => {
    const b = document.createElement('button');
    b.type = 'button';
    const k = document.createElement('kbd'); k.textContent = String(i + 1);
    const r = document.createElement('span'); r.className = 'role'; r.textContent = d.role;
    b.append(k, d.name, r);
    b.addEventListener('click', () => show(i));
    bar.append(b);
  });

  const sep = document.createElement('span'); sep.className = 'sep'; sep.setAttribute('aria-hidden', 'true');
  const cardBtn = tool('Card (i)', () => { note.hidden = !note.hidden; cardBtn.setAttribute('aria-pressed', String(!note.hidden)); });
  const widthBtn = tool('390 px (w)', () => { const on = document.body.classList.toggle('narrow'); widthBtn.setAttribute('aria-pressed', String(on)); });
  bar.append(sep, cardBtn, widthBtn);

  function tool(label, fn) {
    const b = document.createElement('button');
    b.type = 'button'; b.textContent = label; b.setAttribute('aria-pressed', 'false');
    b.addEventListener('click', fn);
    return b;
  }

  function show(i) {
    current = (i + DIRECTIONS.length) % DIRECTIONS.length;
    const d = DIRECTIONS[current];
    stage.src = d.file;
    stage.title = d.name;
    [...bar.children].slice(0, DIRECTIONS.length).forEach((b, j) => b.setAttribute('aria-current', String(j === current)));
    note.replaceChildren();
    const h = document.createElement('h2'); h.textContent = d.name + ' (' + d.role + ')';
    const p = document.createElement('p'); p.textContent = d.thesis;
    note.append(h, p);
    const url = new URL(location.href); url.searchParams.set('v', d.id);
    history.replaceState(null, '', url);
  }

  function onKey(e) {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.target.closest && e.target.closest('input, textarea, select, [contenteditable]')) return;
    const n = Number(e.key);
    if (n >= 1 && n <= DIRECTIONS.length) show(n - 1);
    else if (e.key === 'ArrowRight') show(current + 1);
    else if (e.key === 'ArrowLeft') show(current - 1);
    else if (e.key === 'i') cardBtn.click();
    else if (e.key === 'w') widthBtn.click();
  }
  addEventListener('keydown', onKey);
  // Keys keep working after a click inside the mock, where the browser allows it (same origin).
  stage.addEventListener('load', () => { try { stage.contentWindow.addEventListener('keydown', onKey); } catch (err) {} });

  const start = DIRECTIONS.findIndex((d) => d.id === new URL(location.href).searchParams.get('v'));
  show(start >= 0 ? start : 0);
</script>
</body>
</html>
