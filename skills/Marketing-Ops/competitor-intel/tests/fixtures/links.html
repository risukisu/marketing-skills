<!DOCTYPE html>
<html><head>
<title>Link forms</title>
</head><body>
<a href="services/consulting">bare relative</a>
<a href="./about-us">dot-slash relative</a>
<a href="../parent-page">parent relative</a>
<a href="/root-page">root relative</a>
<a href="https://example.com/absolute-page">absolute, same host</a>
<a href="https://uk.example.com/subdomain-page">subdomain, same site</a>
<a href="https://notexample.com/lookalike">lookalike host</a>
<a href="https://cdn.other.net/track?u=example.com">host in a query parameter</a>
<a href="https://external.example.org/partner">plainly offsite</a>
<a href="mailto:hello@example.com">mail link</a>
</body></html>
